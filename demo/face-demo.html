<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agent Face Demo — 22B Labs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0d0d12; color: #e0e0e8;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 48px 24px 64px;
    }
    header { text-align: center; margin-bottom: 52px; }
    header h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; color: #f0f0f8; }
    header p  { margin-top: 10px; font-size: 0.9rem; color: #7a7a92; max-width: 520px; }
    .badge {
      display: inline-block; margin-top: 12px; font-size: 0.72rem;
      letter-spacing: 0.08em; text-transform: uppercase; color: #555577;
      border: 1px solid #333344; border-radius: 100px; padding: 3px 10px;
    }
    .grid { display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; max-width: 900px; }
    .card {
      background: #13131e; border: 1px solid #22223a; border-radius: 16px;
      padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 18px;
      transition: transform 0.18s ease, border-color 0.18s ease; cursor: default;
    }
    .card:hover { transform: translateY(-4px); border-color: #3a3a60; }
    .face-wrap { filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5)); }
    .face-wrap svg { display: block; }
    .meta { width: 100%; }
    .meta-row {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.78rem; line-height: 1.8;
      border-bottom: 1px solid #1d1d2e; padding: 2px 0;
    }
    .meta-row:last-child { border-bottom: none; }
    .meta-key { color: #55557a; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .meta-val { color: #c0c0d8; font-family: 'Menlo','Consolas',monospace; font-size: 0.75rem; }
    .trait-list { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
    .trait { background: #1e1e32; border-radius: 4px; padding: 1px 6px; font-size: 0.68rem; color: #8080aa; }
    footer { margin-top: 64px; font-size: 0.75rem; color: #33334a; text-align: center; }
  </style>
</head>
<body>
<header>
  <h1>Agent Face Generator</h1>
  <p>Non-human geometric faces derived from role, personality, and platform.<br>
     Each agent has a unique visual language — not an imitation of human appearance.</p>
  <span class="badge">Phase 2 · Face Generator · 22B Labs</span>
</header>
<div class="grid" id="output"></div>
<footer>Generated in-browser · No network requests · Pure JS</footer>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  Face generator (inlined from src/generators/face.js)
// ─────────────────────────────────────────────────────────────────────────────
const W = 220, H = 220, CX = 110, CY = 110;

function fnv1a32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); h >>>= 0; }
  return h;
}
function computeSeed(agentId, role, personality, platform) {
  const pStr = [...personality].sort().join(',');
  return fnv1a32(`${agentId}\0${role}\0${pStr}\0${platform}`);
}
function makePRNG(seed) {
  let s = (seed >>> 0) || 0xcafebabe;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 0x100000000; };
}
function polyPoints(cx, cy, r, n, rotDeg) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (2*Math.PI*i/n) + (rotDeg*Math.PI/180);
    pts.push(`${(cx+r*Math.cos(a)).toFixed(2)},${(cy+r*Math.sin(a)).toFixed(2)}`);
  }
  return pts.join(' ');
}
function pickShape(role) {
  const r = role.toLowerCase();
  if (/cod|engineer|dev|build|tech/.test(r))    return { kind:'hex',  n:6, rot:0    };
  if (/assist|help|support|chat|guide/.test(r)) return { kind:'cir',  n:0, rot:0    };
  if (/analyt|research|data|scien/.test(r))     return { kind:'dia',  n:4, rot:45   };
  if (/creat|design|art|writ/.test(r))          return { kind:'oct',  n:8, rot:22.5 };
  return [{ kind:'hex',n:6,rot:0 },{ kind:'oct',n:8,rot:22.5 },{ kind:'pent',n:5,rot:-90 },{ kind:'dia',n:4,rot:45 },{ kind:'cir',n:0,rot:0 }][fnv1a32(role) % 5];
}
function shapeEl(sh, cx, cy, r, fill, stroke) {
  if (sh.kind === 'cir') return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;
  return `<polygon points="${polyPoints(cx,cy,r,sh.n,sh.rot)}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;
}
function innerRingEl(sh, cx, cy, r, dark) {
  if (sh.kind === 'cir') return `<circle cx="${cx}" cy="${cy}" r="${r-9}" fill="none" stroke="${dark}" stroke-width="0.6" opacity="0.18"/>`;
  return `<polygon points="${polyPoints(cx,cy,r-9,sh.n,sh.rot)}" fill="none" stroke="${dark}" stroke-width="0.6" opacity="0.18"/>`;
}
const PLATFORM_HUE = { openai:158, anthropic:28, google:213, mistral:270, meta:220, cohere:45, groq:180 };
function palette(platform, seed) {
  const h = PLATFORM_HUE[platform.toLowerCase()] ?? (seed % 360);
  return { h, s: 55+((seed>>8)&0x1f), l: 26+((seed>>14)&0x18) };
}
function pickEyeStyle(traits) {
  const t = traits.join(' ').toLowerCase();
  if (/logical|precise|struct|strict/.test(t)) return 'square';
  if (/curious|explor|learn|wonder/.test(t))   return 'diamond';
  if (/open|friend|warm|care/.test(t))         return 'circle';
  if (/assert|direct|focus|driven/.test(t))    return 'triangle';
  if (/calm|steady|patient|quiet/.test(t))     return 'slit';
  return 'circle';
}
function eyeEl(x, y, sz, style, color) {
  const h=sz/2, f=v=>v.toFixed(1);
  switch(style) {
    case 'square':   return `<rect x="${f(x-h)}" y="${f(y-h)}" width="${f(sz)}" height="${f(sz)}" rx="1" fill="${color}"/>`;
    case 'diamond':  return `<polygon points="${f(x)},${f(y-sz*.9)} ${f(x+sz*.65)},${f(y)} ${f(x)},${f(y+sz*.9)} ${f(x-sz*.65)},${f(y)}" fill="${color}"/>`;
    case 'triangle': return `<polygon points="${f(x)},${f(y-sz*.9)} ${f(x+sz*.8)},${f(y+sz*.65)} ${f(x-sz*.8)},${f(y+sz*.65)}" fill="${color}"/>`;
    case 'slit':     return `<rect x="${f(x-sz*.9)}" y="${f(y-sz*.22)}" width="${f(sz*1.8)}" height="${f(sz*.44)}" rx="${f(sz*.22)}" fill="${color}"/>`;
    default:         return `<circle cx="${f(x)}" cy="${f(y)}" r="${f(h)}" fill="${color}"/>`;
  }
}
function eyeHighlight(x,y,sz) {
  return `<circle cx="${(x-sz*.22).toFixed(1)}" cy="${(y-sz*.22).toFixed(1)}" r="${(sz*.18).toFixed(1)}" fill="white" opacity="0.65"/>`;
}
function signalEl(cx, y, traits, color) {
  const t=traits.join(' ').toLowerCase(), x1=cx-36, x2=cx+36, sw=2;
  if (/energet|active|enthu|dynamic/.test(t)) return `<path d="M${x1},${y} C${x1+10},${y-9} ${cx-10},${y+9} ${cx},${y} C${cx+10},${y-9} ${x2-10},${y+9} ${x2},${y}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
  if (/help|assist|warm|friend|care/.test(t)) return `<path d="M${x1},${y+5} Q${cx},${y-10} ${x2},${y+5}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
  if (/focus|serious|analyt|deep/.test(t))    return `<line x1="${x1}" y1="${y-3}" x2="${x2}" y2="${y-3}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/><line x1="${x1+6}" y1="${y+4}" x2="${x2-6}" y2="${y+4}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
  if (/creat|play|art|fun|expres/.test(t))    return `<polyline points="${x1},${y} ${x1+18},${y-8} ${cx},${y} ${cx+18},${y-8} ${x2},${y}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
}
function accentMarks(traits, cx, cy, r, color, rand) {
  if (traits.length < 2) return '';
  return Array.from({ length: Math.min(traits.length, 7) }, (_, i) => {
    const a=(2*Math.PI*i/Math.min(traits.length,7))+rand()*.25, d=r+10+rand()*10;
    return `<circle cx="${(cx+d*Math.cos(a)).toFixed(1)}" cy="${(cy+d*Math.sin(a)).toFixed(1)}" r="${(1.5+rand()*2.5).toFixed(1)}" fill="${color}" opacity="0.32"/>`;
  }).join('');
}
function generateFace(agentId, role, personality, platform) {
  const traits=Array.isArray(personality)?personality:[];
  const seed=computeSeed(agentId,role,traits,platform), rand=makePRNG(seed);
  const sh=pickShape(role), pal=palette(platform,seed), R=74;
  const dark=`hsl(${pal.h},${pal.s}%,${pal.l}%)`;
  const light=`hsl(${pal.h},${Math.round(pal.s*.1)}%,97%)`;
  const mid=`hsl(${pal.h},${Math.round(pal.s*.28)}%,${pal.l+32}%)`;
  const eyeC=`hsl(${pal.h},${pal.s}%,${Math.max(pal.l-4,10)}%)`;
  const eyeStyle=pickEyeStyle(traits), eyeSz=9+rand()*7, eyeSpread=22+rand()*14;
  const eyeY=CY-10+(rand()-.5)*8, sigY=CY+26+rand()*8;
  const eyeLx=CX-eyeSpread, eyeRx=CX+eyeSpread, svgH=H+14;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${svgH}" viewBox="0 0 ${W} ${svgH}" role="img" aria-label="Face for ${agentId}">
  <title>Agent Face · ${agentId}</title>
  <rect width="${W}" height="${svgH}" rx="10" fill="hsl(${pal.h},${Math.round(pal.s*.08)}%,97%)"/>
  <rect x="3" y="3" width="${W-6}" height="${svgH-6}" rx="8" fill="none" stroke="${mid}" stroke-width="1.5"/>
  ${accentMarks(traits,CX,CY,R,dark,rand)}
  ${shapeEl(sh,CX,CY,R,light,mid)}
  ${innerRingEl(sh,CX,CY,R,dark)}
  ${eyeEl(eyeLx,eyeY,eyeSz,eyeStyle,eyeC)}
  ${eyeEl(eyeRx,eyeY,eyeSz,eyeStyle,eyeC)}
  ${eyeHighlight(eyeLx,eyeY,eyeSz)}
  ${eyeHighlight(eyeRx,eyeY,eyeSz)}
  ${signalEl(CX,sigY,traits,dark)}
  <text x="${W/2}" y="${svgH-4}" text-anchor="middle" font-family="monospace" font-size="7.5" fill="${dark}" opacity="0.55">${role.slice(0,16)} · ${platform.slice(0,10)}</text>
</svg>`;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Sample agents
// ─────────────────────────────────────────────────────────────────────────────
const AGENTS = [
  { agentId:'codex-coder-v1',    name:'CodexCoder',    role:'CodeEngineer',  personality:['logical','precise','focused'],              platform:'anthropic' },
  { agentId:'data-sentinel-v2',  name:'DataSentinel',  role:'DataAnalyst',   personality:['analytical','curious','systematic'],        platform:'openai'    },
  { agentId:'creative-weaver-v3',name:'CreativeWeaver',role:'CreativeWriter',personality:['creative','expressive','warm','playful'],   platform:'google'    },
];

const container = document.getElementById('output');
for (const a of AGENTS) {
  const svg = generateFace(a.agentId, a.role, a.personality, a.platform);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="face-wrap">${svg}</div>
    <div class="meta">
      <div class="meta-row"><span class="meta-key">agent</span><span class="meta-val">${a.name}</span></div>
      <div class="meta-row"><span class="meta-key">role</span><span class="meta-val">${a.role}</span></div>
      <div class="meta-row"><span class="meta-key">platform</span><span class="meta-val">${a.platform}</span></div>
      <div class="meta-row">
        <span class="meta-key">traits</span>
        <span class="meta-val"><div class="trait-list">${a.personality.map(t=>`<span class="trait">${t}</span>`).join('')}</div></span>
      </div>
    </div>`;
  container.appendChild(card);
}
</script>
</body>
</html>
