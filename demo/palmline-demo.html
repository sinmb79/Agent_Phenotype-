<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agent Palm Line Demo — 22B Labs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0d0d12; color: #e0e0e8;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 48px 24px 64px;
    }
    header { text-align: center; margin-bottom: 52px; }
    header h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; color: #f0f0f8; }
    header p  { margin-top: 10px; font-size: 0.9rem; color: #7a7a92; max-width: 520px; }
    .badge {
      display: inline-block; margin-top: 12px; font-size: 0.72rem;
      letter-spacing: 0.08em; text-transform: uppercase; color: #555577;
      border: 1px solid #333344; border-radius: 100px; padding: 3px 10px;
    }
    .grid { display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; max-width: 960px; }
    .card {
      background: #13131e; border: 1px solid #22223a; border-radius: 16px;
      padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 18px;
      transition: transform 0.18s ease, border-color 0.18s ease; cursor: default;
    }
    .card:hover { transform: translateY(-4px); border-color: #3a3a60; }
    .palm-wrap { filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5)); }
    .palm-wrap svg { display: block; }
    .age-badge {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 10px; border-radius: 100px;
      border: 1px solid;
    }
    .age-new      { color: #5a8a6a; border-color: #2a4a3a; background: #111a14; }
    .age-mid      { color: #8a7a3a; border-color: #4a3a1a; background: #1a1808; }
    .age-veteran  { color: #8a4a3a; border-color: #4a2a1a; background: #1a1008; }
    .meta { width: 100%; }
    .meta-row {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.78rem; line-height: 1.8;
      border-bottom: 1px solid #1d1d2e; padding: 2px 0;
    }
    .meta-row:last-child { border-bottom: none; }
    .meta-key { color: #55557a; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .meta-val { color: #c0c0d8; font-family: 'Menlo','Consolas',monospace; font-size: 0.75rem; }
    .stat-bar { display: flex; align-items: center; gap: 8px; width: 100%; }
    .bar-track { flex: 1; height: 4px; background: #1e1e32; border-radius: 2px; }
    .bar-fill  { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
    footer { margin-top: 64px; font-size: 0.75rem; color: #33334a; text-align: center; }
  </style>
</head>
<body>
<header>
  <h1>Agent Palm Line Generator</h1>
  <p>Palm complexity grows with accumulated activity. A new agent has almost no lines.<br>
     A veteran agent's palm shows a dense, readable history.</p>
  <span class="badge">Phase 3 · Palm Line Generator · 22B Labs</span>
</header>
<div class="grid" id="output"></div>
<footer>Generated in-browser · No network requests · Pure JS</footer>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  Palm line generator (inlined from src/generators/palmline.js)
// ─────────────────────────────────────────────────────────────────────────────
const PALM_PATH = 'M 42,98 C 36,62 58,44 100,40 C 142,44 164,62 158,98 L 164,198 Q 160,252 100,254 Q 40,252 36,198 Z';
const B = { xMin:52, xMax:148, yMin:68, yMax:238 };
const W = 200, H = 280;

function fnv1a32(str) {
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); h>>>=0; }
  return h;
}
function computeSeed(id,s){ return fnv1a32(`${id}\0${JSON.stringify(s||{})}`); }
function makePRNG(seed){ let s=(seed>>>0)||0xcafebabe; return ()=>{ s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/0x100000000; }; }
function activityToParams(s) {
  const tc=Math.max(0,s.taskCount||0), sr=Math.min(1,Math.max(0,s.successRate??0.75));
  return { lineCount:Math.min(18,2+Math.floor(tc/25)), thickness:0.6+Math.min(tc/180,1.8), opacity:0.22+Math.min(tc/280,0.62), curvature:0.3+Math.min(tc/400,0.65), continuity:sr };
}
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function makeLine(rand,params,index,total) {
  const {xMin,xMax,yMin,yMax}=B, spanX=xMax-xMin, spanY=yMax-yMin, zone=index/Math.max(total-1,1);
  let x1,y1,x2,y2;
  if(zone<0.33){ x1=xMin+rand()*spanX*.25; y1=yMin+zone*spanY*.5+rand()*18; x2=xMax-rand()*spanX*.18; y2=y1+24+rand()*58; }
  else if(zone<0.66){ x1=xMin+rand()*spanX*.35; y1=yMin+spanY*.22+rand()*spanY*.3; x2=xMin+spanX*.48+rand()*spanX*.38; y2=y1+32+rand()*76; }
  else { x1=xMin+rand()*spanX*.4; y1=yMin+spanY*.52+rand()*spanY*.3; x2=x1+spanX*.28+rand()*spanX*.22; y2=y1+rand()*46-12; }
  x1=clamp(x1,xMin,xMax); y1=clamp(y1,yMin,yMax); x2=clamp(x2,xMin,xMax); y2=clamp(y2,yMin,yMax);
  const cp1x=lerp(x1,x2,.33)+(rand()-.5)*params.curvature*58, cp1y=lerp(y1,y2,.33)+(rand()-.5)*params.curvature*38;
  const cp2x=lerp(x1,x2,.66)+(rand()-.5)*params.curvature*58, cp2y=lerp(y1,y2,.66)+(rand()-.5)*params.curvature*38;
  const f=v=>v.toFixed(1);
  return `M ${f(x1)},${f(y1)} C ${f(cp1x)},${f(cp1y)} ${f(cp2x)},${f(cp2y)} ${f(x2)},${f(y2)}`;
}
function lineColor(seed){ const h=(seed%55)+12,s=22+((seed>>8)&0x1f),l=20+((seed>>14)&0x18); return `hsl(${h},${s}%,${l}%)`; }
function generatePalmLine(agentId, activitySummary) {
  const summary=activitySummary||{}, seed=computeSeed(agentId,summary), rand=makePRNG(seed);
  const params=activityToParams(summary), color=lineColor(seed);
  const bgH=(seed%55)+12, bg=`hsl(${bgH},6%,97%)`, palmFill=`hsl(${bgH},14%,93%)`, palmRim=`hsl(${bgH},18%,82%)`;
  const clipId=`pc${(seed>>>0).toString(16)}`;
  const lineEls=[];
  for(let i=0;i<params.lineCount;i++){
    const d=makeLine(rand,params,i,params.lineCount);
    const op=(params.opacity*(0.65+0.35*(i%3===0?params.continuity:1))).toFixed(2);
    const sw=(params.thickness*(0.65+0.6*rand())).toFixed(2);
    const dash=params.continuity<0.5&&rand()<0.4?` stroke-dasharray="${(4+rand()*4).toFixed(1)},${(3+rand()*3).toFixed(1)}"`:'';
    lineEls.push(`<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" opacity="${op}"${dash}/>`);
  }
  const tc=summary.taskCount??0, sr=summary.successRate!=null?Math.round(summary.successRate*100):'?', svgH=H+14;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${svgH}" viewBox="0 0 ${W} ${svgH}" role="img" aria-label="Palm line for ${agentId}">
  <title>Agent Palm Line · ${agentId}</title>
  <defs><clipPath id="${clipId}"><path d="${PALM_PATH}"/></clipPath></defs>
  <rect width="${W}" height="${svgH}" rx="10" fill="${bg}"/>
  <rect x="3" y="3" width="${W-6}" height="${svgH-6}" rx="8" fill="none" stroke="hsl(${bgH},14%,85%)" stroke-width="1.5"/>
  <path d="${PALM_PATH}" fill="${palmFill}" stroke="${palmRim}" stroke-width="1.5"/>
  <g clip-path="url(#${clipId})">${lineEls.join('')}</g>
  <text x="${W/2}" y="${svgH-4}" text-anchor="middle" font-family="monospace" font-size="7.5" fill="${color}" opacity="0.55">${agentId.slice(0,12)} · ${tc} tasks · ${sr}% success</text>
</svg>`;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Sample agents — new / mid / veteran
// ─────────────────────────────────────────────────────────────────────────────
const AGENTS = [
  {
    agentId: 'codex-coder-v1', name: 'CodexCoder', age: 'new',
    activity: { taskCount:8,   taskTypes:['code'],                             totalDuration:120,   successRate:0.88 },
  },
  {
    agentId: 'data-sentinel-v2', name: 'DataSentinel', age: 'mid',
    activity: { taskCount:187, taskTypes:['analysis','research','report'],      totalDuration:4820,  successRate:0.79 },
  },
  {
    agentId: 'creative-weaver-v3', name: 'CreativeWeaver', age: 'veteran',
    activity: { taskCount:634, taskTypes:['write','edit','design','ideate'],    totalDuration:18200, successRate:0.91 },
  },
];

const container = document.getElementById('output');
for (const a of AGENTS) {
  const svg = generatePalmLine(a.agentId, a.activity);
  const pct = Math.round(a.activity.successRate * 100);
  const barColor = a.age === 'veteran' ? '#8a4a3a' : a.age === 'mid' ? '#8a7a3a' : '#5a8a6a';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="palm-wrap">${svg}</div>
    <span class="age-badge age-${a.age}">${a.age === 'new' ? 'New Agent' : a.age === 'mid' ? 'Mid-Career' : 'Veteran'}</span>
    <div class="meta">
      <div class="meta-row"><span class="meta-key">agent</span><span class="meta-val">${a.name}</span></div>
      <div class="meta-row"><span class="meta-key">tasks done</span><span class="meta-val">${a.activity.taskCount.toLocaleString()}</span></div>
      <div class="meta-row"><span class="meta-key">task types</span><span class="meta-val">${a.activity.taskTypes.join(', ')}</span></div>
      <div class="meta-row">
        <span class="meta-key">success rate</span>
        <span class="meta-val">
          <div class="stat-bar">
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
            <span>${pct}%</span>
          </div>
        </span>
      </div>
      <div class="meta-row"><span class="meta-key">active time</span><span class="meta-val">${Math.round(a.activity.totalDuration/60)} hrs</span></div>
    </div>`;
  container.appendChild(card);
}
</script>
</body>
</html>
